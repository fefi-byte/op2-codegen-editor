; Kopie nach config.ini (neben der EXE bzw. im Projekt-Root) und Pfade anpassen.
; config.ini ist git-ignoriert (maschinenspezifisch).
[paths]
# Outpost-2-Installation (Ordner mit maps.vol bzw. OPU/-Unterordner)
# Windows:  game_path = D:\Outpost 2
# Linux:    game_path = /home/<user>/.wine/drive_c/Games/Outpost 2
game_path = D:\Outpost 2

# op2-ki (eigenes Projekt, https://github.com/fefi-byte/op2-ki): leer = das
# Submodul op2-ki/ (bzw. die Kopie im Release). Nur fuer einen eigenen Checkout setzen.
# op2ki.dll kommt fertig aus dem op2-ki-Release (fertig/op2ki.dll); selbst bauen siehe [build].
# op2-ki (separate project): empty = the op2-ki/ submodule (or the copy in the
# release). Set only for your own checkout. op2ki.dll ships ready-built (see [build] to build it yourself).
# op2ki_path = D:\op2-ki
op2ki_path =

# OP2MappingLib (https://github.com/OutpostUniverse/OP2MappingLib): leer = das
# Submodul OP2MappingLib/ (bzw. die Kopie im Release).
# OP2MappingLib: empty = the OP2MappingLib/ submodule (or the copy in the release).
# op2maplib_path = D:\OP2MappingLib
op2maplib_path =

# Visual-Studio-Installation (Ordner mit Common7\Tools\VsDevCmd.bat)
# Nur unter Windows relevant; unter Linux wird dieser Wert ignoriert.
# Only relevant on Windows; ignored on Linux.
msvs_path = C:\Program Files\Microsoft Visual Studio\18\Community

[build]
# Nur noetig, wenn das v142-Toolset (VS2019) fehlt:
# v143 = VS2022, v145 = VS2026. Leer lassen = Projekt-Vorgabe (v142).
# Only relevant on Windows (MSVC). Leave empty on Linux.
platform_toolset =
# op2ki.dll selbst aus den op2-ki-Quellen bauen statt die fertige zu nehmen
# (Rust: https://rustup.rs, dann 'rustup target add i686-pc-windows-msvc').
# Build op2ki.dll yourself from the op2-ki sources instead of the ready-built one.
op2ki_selbst_bauen = false
# op2maplib.dll (OP2MappingLib) selbst aus den Quellen des Submoduls bauen statt
# die fertige DLL des Submoduls zu nehmen (CMake + Visual Studio mit C++).
# Build op2maplib.dll from the submodule's sources instead of its prebuilt DLL
# (CMake + Visual Studio with C++). Rebuilt when a source file changes.
op2maplib_selbst_bauen = false
windows_sdk =

[terrain]
# Gelaendepinsel, Klippen und "Uebergaenge aufraeumen" ueber OP2MappingLib
# rechnen. false = der eingebaute Python-Weg (auch, wenn die Bibliothek fehlt).
# Terrain brush, cliffs and transition clean-up via OP2MappingLib.
# false = the built-in Python path (also used when the library is missing).
op2maplib = true

[output]
# Zielordner der Mission-DLL (leer = game_path/OPU wenn vorhanden, sonst game_path)
# Linux-Beispiel: /home/<user>/.wine/drive_c/Games/Outpost 2/OPU
output_dir =
# Dateiname der Mission-DLL (Colony-Missionen brauchen den Praefix "c")
dll_name = cEditorMission.dll

[ui]
# Sprache der Oberflaeche: auto (Systemsprache erkennen), de, en (lang.<code>.ini)
language = auto
# Kachelgitter ueber der Karte anzeigen (true/false)
show_grid = false
