[cond_help]
time = Met once the given time (in marks) has passed.
lastStanding = Victory when every enemy (AI) colony is completely destroyed – one condition per enemy, all must fall.
starship = Victory once the evacuation module has been launched (classic starship ending).
buildingCount = Compares the player's total building count against the target value.
vehicleCount = Compares the player's total vehicle count against the target value.
vehicleCargo = Counts vehicles of a type carrying a specific cargo (e.g. trucks with ore).
research = Met once the player has researched the given technology.
resource = Compares a resource stockpile (ore, food, colonists …) against the target value.
operational = Compares the number of OPERATIONAL buildings of a type (powered/staffed) against the target value.
noCC = Defeat once the player no longer owns a Command Center (the classic).
point = Met once one of the player's units enters the given tile.
rect = Met once one of the player's units enters the given rectangle.
attacked = Met once the selected group comes under attack.
damaged = Met once the selected fraction of the group has been destroyed.
specialTarget = Met once the scanner unit (e.g. Scout) has "investigated" the named target.
onePlayerLeft = Engine-native "Last One Standing": met when only one player remains.
evac = Spacerace ending: met once the player's evacuation has been triggered.
midas = Midas mode: met after the given time (in marks) has passed.
kit = Compares the number of stored building kits of the type (engine's own comparison).
escape = Met once enough vehicles of the type (with matching cargo) reach the target rectangle – e.g. "bring 2 loaded trucks to the escape zone".

