name: Build & Release

on:
  push:
    tags:
      - "v*"          # startet bei jedem Tag wie v0.2.0, v1.0.0 usw.

jobs:
  build-windows:
    runs-on: windows-latest
    # Herkunftsnachweis (actions/attest-build-provenance) und Release anlegen.
    # Build provenance attestation and creating the release.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: op2-ki auf das neueste Release (Tag v*)
        shell: bash
        run: |
          git -C op2-ki fetch --force --tags origin
          t=$(git -C op2-ki tag -l "v*" --sort=-v:refname | head -n 1)
          test -n "$t"
          git -C op2-ki checkout --quiet "$t"
          echo "op2-ki $t"

      # op2maplib.dll aus den Quellen des Submoduls bauen (nicht die fertige
      # DLL des Submoduls mitliefern) und testen; op2editor.spec buendelt sie.
      # Build op2maplib.dll from the submodule's sources (instead of shipping
      # the submodule's prebuilt DLL) and test it; op2editor.spec bundles it.
      - name: op2maplib aus den Quellen bauen
        shell: pwsh
        run: |
          cmake -S OP2MappingLib -B build-op2maplib -A x64
          cmake --build build-op2maplib --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build-op2maplib\bin\Release\op2maplib_tests.exe OP2MappingLib\profiles\op2.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $h = (Get-FileHash build-op2maplib\bin\Release\op2maplib.dll -Algorithm SHA256).Hash.ToLower()
          "op2maplib.dll SHA-256: $h" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install PySide6 numpy Pillow pyinstaller

      # Versionsnummer aus dem Tag fuer den Ueber-Dialog.
      # Version number from the tag for the About dialog.
      - name: Version aus dem Tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^VERSION = .*/VERSION = \"$v\"/" editor/app/version.py
          cat editor/app/version.py

      - name: EXE bauen
        run: python -m PyInstaller op2editor.spec

      - name: Zip erstellen
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "dist\OP2MissionBuilder\*" `
                           -DestinationPath "dist\OP2MissionBuilder_$tag.zip"
        shell: pwsh

      # Pruefsummen und Herkunftsnachweis: wer will, prueft, dass ZIP und op2maplib.dll von
      # diesem Workflow aus diesem Commit gebaut wurden:
      #   gh attestation verify <datei> --repo fefi-byte/op2-codegen-editor
      # Checksums and build provenance: anyone can verify that the ZIP and op2maplib.dll were
      # built by this workflow from this commit.
      - name: Pruefsummen
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item build-op2maplib\bin\Release\op2maplib.dll dist\op2maplib.dll
          $z = "dist\OP2MissionBuilder_$tag.zip"
          $zeilen = foreach ($f in @($z, "dist\op2maplib.dll", "op2-ki\fertig\op2ki.dll")) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)" }
          $zeilen | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          $zeilen | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Herkunftsnachweis
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/OP2MissionBuilder_${{ github.ref_name }}.zip
            dist/op2maplib.dll

      - name: GitHub Release erstellen & ZIP hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OP2MissionBuilder ${{ github.ref_name }}"
          body: |
            ## OP2MissionBuilder ${{ github.ref_name }}

            ### Installation (Windows)
            1. ZIP entpacken
            2. `OP2MissionBuilder.exe` starten
            3. In der erzeugten `config.ini` den `game_path` auf dein Outpost 2 Verzeichnis setzen

            ### Voraussetzungen
            - Windows 10/11 (64-bit)
            - Visual Studio Build Tools mit C++ (für den Missions-Build; der
              klassische OP2-SDK-Unterbau braucht MSVC)
            - Outpost 2 (OPU 1.4.1 empfohlen)
            - Enthalten ist das neueste op2-ki-Release samt fertiger op2ki.dll; wer sie
              selbst bauen will: Rust und `[build] op2ki_selbst_bauen = true` in config.ini.

            Pruefen, dass ZIP und op2maplib.dll aus diesem Repo gebaut wurden (GitHub CLI):
            `gh attestation verify OP2MissionBuilder_${{ github.ref_name }}.zip --repo fefi-byte/op2-codegen-editor`.
            Pruefsummen in `SHA256SUMS.txt`. op2maplib.dll baut dieser Workflow aus den Quellen von
            OP2MappingLib; op2ki.dll kommt fertig aus dem op2-ki-Release.

            Alle Neuerungen stehen im [CHANGELOG](https://github.com/fefi-byte/op2-codegen-editor/blob/main/CHANGELOG.md).
          files: |
            dist/OP2MissionBuilder_${{ github.ref_name }}.zip
            dist/op2maplib.dll
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false

  # Der frühere build-linux-Job entfällt: der OP2MissionSDK-Unterbau ist
  # MSVC-only, Missions-Builds unter Linux werden nicht mehr unterstützt.
  # The former build-linux job is gone: the OP2MissionSDK backend is
  # MSVC-only; mission builds on Linux are no longer supported.
