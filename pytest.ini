[pytest]
# Submodule nicht mitsammeln: OP2MappingLib bringt eigene Tests mit, die ihre
# DLL aus dem eigenen CMake-Build suchen.
# Do not collect the submodules: OP2MappingLib ships its own tests, which look
# for the DLL in its own CMake build.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} OP2MappingLib OP2MissionSDK op2-ki
