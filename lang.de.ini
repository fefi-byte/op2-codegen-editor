[cond_help]
time = Erfüllt, sobald die angegebene Zeit (in Marks) vergangen ist.
lastStanding = Sieg, wenn alle gegnerischen (KI-)Kolonien vollständig zerstört sind – eine Bedingung pro Gegner, alle müssen fallen.
starship = Sieg, sobald das Evakuierungsmodul gestartet wurde (klassisches Raumschiff-Ende).
buildingCount = Vergleicht die Gesamtzahl der Gebäude des Spielers mit dem Zielwert.
vehicleCount = Vergleicht die Gesamtzahl der Fahrzeuge des Spielers mit dem Zielwert.
vehicleCargo = Zählt Fahrzeuge eines Typs mit einer bestimmten Ladung (z.B. Trucks mit Erz).
research = Erfüllt, sobald der Spieler die angegebene Technologie erforscht hat.
resource = Vergleicht einen Ressourcen-Vorrat (Erz, Nahrung, Kolonisten …) mit dem Zielwert.
operational = Vergleicht die Anzahl BETRIEBSBEREITER Gebäude eines Typs (mit Strom/Arbeitern) mit dem Zielwert.
noCC = Niederlage, sobald der Spieler kein Command Center mehr besitzt (Klassiker).
point = Erfüllt, sobald eine Einheit des Spielers die angegebene Kachel betritt.
rect = Erfüllt, sobald eine Einheit des Spielers das angegebene Rechteck betritt.
attacked = Erfüllt, sobald die gewählte Gruppe angegriffen wird.
damaged = Erfüllt, sobald der gewählte Anteil der Gruppe zerstört wurde.
specialTarget = Erfüllt, sobald die Scanner-Einheit (z.B. Scout) das benannte Ziel "untersucht" hat.
onePlayerLeft = Engine-natives "Last One Standing": erfüllt, wenn nur noch ein Spieler übrig ist.
evac = Spacerace-Ende: erfüllt, sobald die Evakuierung des Spielers ausgelöst wurde.
midas = Midas-Modus: erfüllt nach Ablauf der angegebenen Zeit (in Marks).
kit = Vergleicht die Anzahl eingelagerter Gebäude-Bausätze des Typs (Engine-eigener Vergleich).
escape = Erfüllt, sobald genügend Fahrzeuge des Typs (mit passender Ladung) das Zielrechteck erreichen – z.B. "bringe 2 beladene Trucks zur Fluchtzone".

